# Default configuration values for Describe Media
# These defaults are used when environment variables or command-line arguments are not provided.

[directories]
# Directory configuration
input_dir = ""  # Required - no default
output_dir = ""  # Will use INPUT_DIR if not set

[image]
# Image processing
extensions = [".jpg", ".jpeg", ".png", ".webp"]

[video]
# Sample video frames before sending them through the normal image pipeline.
extensions = [".mp4", ".mov", ".mkv", ".avi", ".webm"]
frame_interval_seconds = 5.0
max_frames = 24
# When enabled, send the audio interval represented by every sampled frame to
# the matching remote transcription backend on the shared GPU worker.
transcription_enabled = true
transcription_backend = "faster-whisper"
transcription_model = "turbo"
# Optional ISO-639-1 source-language hint, for example "nl" or "en".
transcription_language = ""
description_prompt = "Beschrijf deze volledige video in het Nederlands op basis van de beschrijvingen van losse videoframes en het transcript. Geef één samenhangende beschrijving van de gebeurtenissen, personen, omgeving en relevante gesproken inhoud. Noem niet dat je framebeschrijvingen of een transcript gebruikt, en verzin geen details die daar niet uit volgen."
[resize]
# Image resizing settings
max_width = 720
max_height = 720

[recognition]
# All recognition models and resulting embeddings stay local. Install the optional
# recognition dependencies before using the recognition or recognition-train commands.
model = "buffalo_l"
enabled = true
# Lower values include more detector results; lower clustering values merge more faces.
detection_threshold = 0.60
cluster_threshold = 0.45
# A name is sent to the LLM only when an index match reaches this score.
match_threshold = 0.55
# Keep threshold-approved image and video-frame crops in provisional review
# clusters. They are never merged into a reviewed identity automatically.
copy_matches_to_review_clusters = true

[metadata]
# Metadata extraction settings
reverse_geocode_gps = false  # Reverse geocode GPS to human-readable location (requires geopy)

[model]
# Model configuration
backend = "openai"

[openai]
# OpenAI API settings. Set OPENAI_API_KEY in .env or the environment.
api_base = "https://api.openai.com/v1"
timeout_s = 600  # 10 minutes in seconds

[lmstudio]
# LM Studio specific settings
sync_api_timeout_s = 600  # 10 minutes in seconds

[huggingface]
# Hugging Face Transformers specific settings
device = "auto"  # Device to run model on: "auto", "cuda", "cpu"
use_quantization = true  # Use 4-bit quantization to reduce memory usage
max_new_tokens = 512  # Maximum tokens to generate
temperature = 0.7  # Sampling temperature
top_p = 0.9  # Nucleus sampling parameter

[describe]
# Describe-image pipeline settings
model = "gpt-5"
# Prompt template with placeholders: {filename}, {datetime}, {location}, {camera}
prompt = "Context:\nBestandsnaam: {filename}\nDatumtijd: {datetime}\nLocatie: {location}\nCamera: {camera}\n\nOpdracht: Beschrijf de foto in het Nederlands. Geef geen informatie terug over context bestandsnaam, datumtijd, locatie en camera, maar als nodig gebruik die informatie wel."
# Output format template for describe pipeline
# Available placeholders: {datetime}, {location}, {content}, {filename}, {camera}
output_format = "Bestandsnaam: {filename}\nDatumtijd: {datetime}\nLocatie: {location}\nCamera: {camera}\n\nBeschrijving:\n{content}"

[enhancement]
# Context enhancement pipeline settings
# Text-only models are typically better for enhancement tasks (faster, cheaper, more focused on language)
# Good options: llama3, mistral, qwen2.5 (text models work well for refining existing descriptions)
model = "microsoft/DialoGPT-medium"
model_context_length = 16384  # Context window size - 16K tokens for 16GB VRAM with 8B model
# Context section template with placeholder: {items} (list of numbered context descriptions)
context_template = "Context van andere foto's uit dezelfde periode/locatie:\n\n{items}\n"
# Single context item template with placeholders: {number}, {description}
context_item_template = "{number}. {description}\n"
# Maximum characters per context item (longer items will be truncated)
context_item_max_length = 1000  # Reduced from 3000 to fit more items within char limit
# Maximum number of context items to include in prompt
max_context_in_prompt = 30  # Increased from 20
# Prompt template with placeholders: {context_section}, {original_description}
prompt = "{context_section}Originele beschrijving van de huidige foto:\n{original_description}\n\nVerbeter de beschrijving van de foto door logische, aannemelijke context af te leiden uit beschrijvingen uit de context. Behoud zichtbare elementen, voeg alleen goed onderbouwde interpretaties toe en vermijd speculatie. Geef één natuurlijke, vloeiende beschrijving van de foto."
context_window_days = 10  # Number of days before/after to look for context images
max_context_items = 100  # Maximum number of context items to gather
max_context_length = 8000  # Maximum total characters for all context - increased from 5000
# Output format template for enhancement pipeline
# Available placeholders: {datetime}, {location}, {content}, {filename}, {camera}
output_format = "Bestandsnaam: {filename}\nDatum tijd: {datetime}\nLocatie: {location}\nVerbeterde beschrijving:\n{content}"

[sorting]
# Sort order: natural-desc, natural-asc, name-desc, name-asc
order = "natural-desc"

[threads]
# Thread counts for each pipeline stage
discover = 1
skip_checker = 1
download = 1
resize = 1
recognition = 1
llm = 1
write = 1
context = 1
enhance = 1

[performance]
# The machine runs only one pipeline task at a time. The scheduler still keeps
# downstream work moving first, and rotates equally placed input branches.
max_concurrent_tasks = 1
# Backpressure control: allow queue to grow to (max * multiplier) before stopping upstream work
backpressure_multiplier = 2.0

[retry]
# Retry previously failed items (files with .error.txt)
failed = false

[output]
# Output format template
# Available placeholders: {datetime}, {location}, {content}, {filename}, {camera}
format = "Datum tijd: {datetime}\nLocatie: {location}\nBeschrijving:\n{content}"

[ui]
# Status update interval (seconds)
status_interval = 5.0
# Verbose output
verbose = false
